<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found - Acamaro Cutcher</title>
    <meta name="robots" content="noindex" />
    <!-- Absolute paths: GitHub Pages serves this file for any missing URL, at any depth -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <style>
      .notfound { min-height: 100vh; display: grid; place-items: center; padding: 2rem 0; }
      .notfound-code { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.08em; color: var(--primary-color); margin-bottom: 0.75rem; }
      .notfound h1 { font-size: clamp(2.2rem, 6vw, 3.5rem); letter-spacing: -0.03em; margin-bottom: 1rem; }
      .notfound p { max-width: 32rem; color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 1.75rem; }
      .notfound-links { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    </style>
  </head>
  <body>
    <main class="notfound page-header" style="border: 0; padding-top: 2rem">
      <div class="container">
        <p class="notfound-code">ERROR 404</p>
        <h1>This page has moved, or never existed.</h1>
        <p>
          The link you followed doesn't lead anywhere on acamaro.com. The projects library lists everything that is
          here.
        </p>
        <div class="notfound-links">
          <a class="btn btn-primary" href="/">Go to the home page</a>
          <a class="btn btn-secondary" href="/projects/">Browse projects &amp; papers</a>
          <a class="btn btn-secondary" href="/cv.html">CV</a>
        </div>
      </div>
    </main>
  </body>
</html>
